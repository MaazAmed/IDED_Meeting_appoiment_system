<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title>
<style>

a{color:var(--a);font-weight:600}*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}

button{cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px)}button.p{background:var(--gr);color:#fff;border:0;font-weight:600;box-shadow:0 4px 14px rgba(11,79,179,.30)}button.p:hover{box-shadow:0 6px 18px rgba(11,79,179,.45)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b10}
.lg{width:92%;max-width:360px;background:var(--c);border-radius:20px;border-top:6px solid #0b4fb3;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.lg .ic{font-size:40px;margin-bottom:6px}.lg h2{margin:0 0 4px}.lg input{width:100%;margin:14px 0 10px;text-align:center;font-size:16px}.lg button{width:100%;padding:11px}
#le{color:#e5484d;min-height:20px;margin:10px 0 0;font-size:13px}
#app{display:flex;min-height:100vh}aside{width:230px;background:#0b0b10;color:#d9dcec;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}

#te,#lo2{margin-top:8px;padding:12px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:600}#rf{margin-top:auto;background:var(--gr2);border:0;color:#fff;font-weight:600}
main{flex:1;padding:24px;max-width:1250px;min-width:0;position:relative}main:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--a)}h3{margin:0 0 14px;padding-bottom:8px;border-bottom:3px solid var(--a)}
.card{background:var(--c);border:1px solid var(--b);border-top:3px solid var(--a);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}.g .card{margin:0}
.kp{position:relative;overflow:hidden}.kp:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--a)}
.k{font-size:30px;font-weight:800;margin-top:4px;color:var(--a)}.m{color:var(--m)}.w{overflow-x:auto}

td button{padding:5px 8px;margin-right:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal div{background:var(--bg);border-radius:12px;padding:8px;min-height:62px;cursor:pointer;border:1px solid transparent}.cal div:hover{border-color:var(--a)}.cal .h{min-height:0;text-align:center;cursor:default;color:var(--m);background:none}
.n{background:var(--gr);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}textarea{width:100%;min-height:80px}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}aside .lo{margin:0 10px 0 4px}#tabs{flex-direction:row;overflow-x:auto;max-width:100%}#rf{margin:0}main{padding:12px}}
</style></head><body>
<div id="login"><div class="lg"><div class="ic">🔐</div><h2>Admin Panel</h2><div class="m">Indus Delta &amp; Edvisa Bookings</div><input id="pw" type="password" placeholder="Enter admin code"><button class="p" id="go">Login</button><p id="le"></p></div></div>
<div id="app" style="display:none"><aside><div class="lo">⚙️ Admin Panel<small>Appointments Manager</small></div><div id="tabs"></div><button id="rf">↻ Refresh</button><button id="te" class="sb">📧 Test Email</button><button id="lo2" class="sb">🚪 Logout</button></aside><main id="v"></main></div>
<script>

function busy(on,m){var e=document.getElementById("tt");if(!e){e=document.createElement("div");e.id="tt";e.style.cssText="position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#0b4fb3;color:#fff;padding:10px 22px;border-radius:30px;font-weight:600;z-index:9999;box-shadow:0 4px 14px #0004";document.body.appendChild(e)}e.textContent=m||"⏳ Please wait...";e.style.display=on?"block":"none"}
function api(o,cb){o.pw=PW;busy(o.action!=="list"||!!PW);fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(function(r){return r.json()}).then(function(j){busy(false);if(!j.ok){if(PW&&j.error!=="Wrong password")alert("Error: "+(j.error||"unknown"));$("le").textContent=j.error==="Invalid brand"?"Server purana hai: naya Code.gs paste karke New version deploy karein":j.error==="Wrong password"?"Galat admin code":(j.error||"Error");if(!PW||j.error==="Wrong password"){$("app").style.display="none";$("login").style.display="block"}return}D=j;var ob=document.getElementById("oldsrv");if(!ob){ob=document.createElement("div");ob.id="oldsrv";ob.style.cssText="background:#c0392b;color:#fff;padding:12px 16px;font-weight:700;position:sticky;top:0;z-index:9998";document.body.insertBefore(ob,document.body.firstChild)}if(j.mailSent===false){alert("⚠ Email NAHI gayi: "+j.mailErr+"\n\nDetail: Google Sheet ke \"Email Log\" tab mein.")}else if(j.mailSent===true){busy(true,"✔ Email bheji gayi");setTimeout(function(){busy(false)},2500)}if(j.ver!=="v6"){ob.style.display="block";ob.textContent="⚠ Server purana hai (Code.gs update nahi hua). Naya Code.gs paste karein, phir Deploy > Manage deployments > pencil > New version > Deploy."}else ob.style.display="none";if(!D.tpl)D.tpl=DEF;else DEF.forEach(function(q){if(!D.tpl.some(function(t){return t.n===q.n}))D.tpl.push({n:q.n,t:q.t})});$("login").style.display="none";$("app").style.display="flex";draw();cb&&cb()}).catch(function(){busy(false);if(PW)alert("Network error - dobara try karein");$("le").textContent="Network error"})}
$("go").onclick=function(){PW=$("pw").value;$("le").textContent="Loading...";api({action:"list"})};$("rf").onclick=function(){api({action:"list"})};
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
var today=iso(new Date()),tom=iso(new Date(Date.now()+864e5));

function wa(r,i){var dt=r.Date||prompt("Date (YYYY-MM-DD):")||"-",tm=r.Time||askTime("Time with AM/PM (e.g. 7:00 PM):")||"-";var t=D.tpl[i].t.replace(/{name}/g,r.Name).replace(/{service}/g,r.Service).replace(/{date}/g,dt).replace(/{time}/g,tm).replace(/{brand}/g,r.Brand==="travel"?"Indus Delta Travels":"Edvisa & Immigrations");t=addNote(t,r.Brand);
 var n=r.Phone.replace(/\D/g,"");if(n[0]==="0")n="92"+n.slice(1);window.open("https://wa.me/"+n+"?text="+encodeURIComponent(t),"_blank")}

function setSt(id,s){var r=D.rows.filter(function(x){return String(x.ID)===String(id)})[0],f={Status:s};if(!r){alert("Record nahi mila - Refresh dabayein");return}
 if(s==="Cancelled"&&!confirm("Cancel appointment of "+r.Name+"? Client ko email/WhatsApp bhi jayega."))return;
 if(s==="Confirmed"){if(!r.Date){var d0=prompt("Date for this appointment (YYYY-MM-DD):");if(d0)f.Date=d0}if(!r.Time){var t0=askTime("Time with AM/PM (e.g. 7:00 PM):");if(t0)f.Time=t0}}

 rows.forEach(function(r){var so="<option value=''>-</option>"+D.staff.map(function(s){return"<option"+(s===r.Staff?" selected":"")+">"+esc(s)+"</option>"}).join("");
 h+="<tr><td>"+esc(r.Date||"-")+"</td><td>"+esc(r.Time||"-")+"</td><td>"+esc(r.Name)+"</td><td>"+esc(r.Phone)+"</td><td>"+esc(r.Service)+"</td><td>"+(r.Brand==="travel"?"Indus":"Edvisa")+"</td><td><span class='pill s-"+esc(r.Status)+"'>"+esc(r.Status)+"</span></td><td><select onchange=\"upd('"+r.ID+"',{Staff:this.value})\">"+so+"</select></td><td>"+
 "<button onclick=\"VW='"+r.ID+"';draw();scrollTo(0,0)\">👁</button> <button onclick=\"setSt('"+r.ID+"','Confirmed')\">✔</button> <button onclick=\"setSt('"+r.ID+"','Cancelled')\">✖</button> <button onclick=\"resch('"+r.ID+"')\">✏️</button> <button onclick=\"wa(D.rows.filter(function(x){return x.ID==='"+r.ID+"'})[0],TP)\">💬</button></td></tr>"});
 return h+"</table></div>"+(rows.length?"":"<p class='m'>No appointments.</p>")}
function sortR(a){return a.slice().sort(function(x,y){return(x.Date+x.Time)<(y.Date+y.Time)?-1:1})}

function by(r,k){var m={};r.forEach(function(x){var v=x[k]||"-";m[v]=(m[v]||0)+1});return Object.keys(m).map(function(v){return"<tr><td>"+esc(v)+"</td><td>"+m[v]+"</td></tr>"}).join("")}
function draw(){$("tabs").innerHTML=TABS.map(function(t){return"<button class='"+(t===tab?"on":"")+"' onclick=\"tab='"+t+"';draw()\">"+IC[t]+" "+t+"</button>"}).join("");var v=$("v"),h="";
 if(tab==="Dashboard"){var mo=today.slice(0,7);h="<div class='g'>"+[["Today",cnt(function(r){return r.Date===today})],["Tomorrow",cnt(function(r){return r.Date===tom})],["New / Pending",cnt(function(r){return r.Status==="New"})],["This Month",cnt(function(r){return(r.Date||r.Created).slice(0,7)===mo})],["Total",D.rows.length]].map(function(x){return"<div class='card kp'><div class='m'>"+x[0]+"</div><div class='k'>"+x[1]+"</div></div>"}).join("")+"</div><div class='card'><h3>Today</h3>"+tbl(sortR(D.rows.filter(function(r){return r.Date===today})))+"</div><div class='card'><h3>New requests</h3>"+tbl(D.rows.filter(function(r){return r.Status==="New"}).slice(-15))+"</div>"}
 if(tab==="Calendar"){var n=new Date(),y=n.getFullYear(),mth=n.getMonth()+CM,d0=new Date(y,mth,1),dim=new Date(y,mth+1,0).getDate();h="<div class='card'><button onclick='CM--;draw()'>◀</button> <b>"+d0.toLocaleString("en",{month:"long",year:"numeric"})+"</b> <button onclick='CM++;draw()'>▶</button><div class='cal' style='margin-top:10px'>"+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(x){return"<div class='h'>"+x+"</div>"}).join("");for(var i=0;i<d0.getDay();i++)h+="<div class='h'></div>";
  for(var d=1;d<=dim;d++){var k=iso(new Date(y,mth,d)),c=cnt(function(r){return r.Date===k});h+="<div onclick=\"F.d='"+k+"';tab='Appointments';draw()\">"+d+(c?" <span class='n'>"+c+"</span>":"")+"</div>"}h+="</div></div>"}
 if(tab==="Appointments"){var r=D.rows.filter(function(x){var q=F.q.toLowerCase();return(!q||(x.Name+x.Phone+x.Email).toLowerCase().indexOf(q)>=0)&&(!F.st||x.Status===F.st)&&(!F.d||x.Date===F.d)});
  h="<div class='card'><input id='q' placeholder='🔎 Search name / phone / email' value='"+esc(F.q)+"' oninput='F.q=this.value;draw();$(\"q\").focus()'> <select onchange='F.st=this.value;draw()'><option value=''>All status</option>"+["New","Confirmed","Cancelled"].map(function(s){return"<option"+(F.st===s?" selected":"")+">"+s+"</option>"}).join("")+"</select> <input type='date' value='"+F.d+"' onchange='F.d=this.value;draw()'> <button onclick=\"F={q:'',st:'',d:''};draw()\">Clear</button> WhatsApp template: <select onchange='TP=this.value'>"+D.tpl.map(function(t,i){return"<option value='"+i+"'"+(i==TP?" selected":"")+">"+esc(t.n)+"</option>"}).join("")+"</select></div><div class='card'>"+tbl(sortR(r))+"</div>"}
 if(tab==="Reports"){var dr=D.rows.filter(function(x){return x.Date===RD}),mr=D.rows.filter(function(x){return(x.Date||"").slice(0,7)===RM});

  h="<div class='card'>Day: <input type='date' value='"+RD+"' onchange='RD=this.value;draw()'> Month: <input type='month' value='"+RM+"' onchange='RM=this.value;draw()'> <button class='p' onclick='csv()'>⬇ Download CSV (all)</button></div>"+blk("Daily "+RD,dr)+blk("Monthly "+RM,mr)}
 if(tab==="Staff"){h="<div class='card'><h3>Staff / Consultants</h3>"+D.staff.map(function(s,i){return"<p>"+esc(s)+" <button onclick='D.staff.splice("+i+",1);api({action:\"saveStaff\",data:D.staff})'>Remove</button></p>"}).join("")+"<input id='ns' placeholder='New staff name'> <button class='p' onclick='var n=$(\"ns\").value.trim();if(n){D.staff.push(n);api({action:\"saveStaff\",data:D.staff})}'>Add</button><p class='m'>Assign staff to an appointment from the Appointments tab.</p></div>"}
 if(tab==="Templates"){h="<div class='card'><h3>WhatsApp Templates</h3><p class='m'>Use {name} {service} {date} {time} {brand}</p>"+D.tpl.map(function(t,i){return"<p><b>"+esc(t.n)+"</b><textarea id='t"+i+"'>"+esc(t.t)+"</textarea></p>"}).join("")+"<button class='p' onclick='D.tpl.forEach(function(t,i){t.t=$(\"t\"+i).value});api({action:\"saveTpl\",data:D.tpl})'>Save templates</button></div>"}

 if(tab==="Message"){var seen={},dl="";D.rows.forEach(function(r){var k=norm(r.Phone);if(!seen[k]){seen[k]=1;dl+="<option value='"+esc(r.Name+" – "+r.Phone)+"'></option>"}});

  "<p><b>1️⃣ Pehle client select karein</b><br><input id='mc' list='cl' placeholder='🔎 Client ka NAAM likhein ya list se chunein' style='width:100%;max-width:340px' onchange='pickC()'><datalist id='cl'>"+dl+"</datalist><br><input id='mn' placeholder='Number (naam chunne par khud bhar jata hai)' style='width:100%;max-width:340px;margin-top:6px' onchange='mfill()'></p>"+

  "<p><b>3️⃣ Message template</b><br><select id='mt' onchange='mfill()'><option value=''>Custom message</option>"+D.tpl.map(function(t,i){return"<option value='"+i+"'>"+esc(t.n)+"</option>"}).join("")+"</select></p>"+

 var bn="<p class='m' style='margin:0 0 12px'>Saved bookings: <b>"+D.rows.length+"</b> · <a href='"+esc(D.sheet||"#")+"' target='_blank'>📄 Open Google Sheet</a></p>"+(D.err?"<div class='card' style='border-color:#e5484d'>⚠️ Last booking save error: "+esc(D.err)+"</div>":"")+(D.rows.length?"":"<div class='card'>Abhi koi booking save nahi hui. Website se ek test booking karein, phir ↻ Refresh dabayein.</div>");

function norm(n){n=String(n||"").replace(/\D/g,"");if(n[0]==="0")n="92"+n.slice(1);return n}
function pickC(){var v=$("mc").value.trim(),n=norm(v.split("–").pop()),r=findR(n);
